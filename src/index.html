<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Portal</title>

  <style>
      :root {
          --q-screen-xs-min: 0px;
          --q-screen-sm-min: 600px;
          --q-screen-md-min: 1024px;
          --q-screen-lg-min: 1440px;
          --q-screen-xl-min: 1920px;

          --app-min-width: 320px;
          --header-height: 80px;
          --page-bg: #f4f6fb;
          --header-bg: #f9fafb;
          --header-color: #374151;
          --card-bg: #ffffff;
          --card-border: #dfe3ec;
          --card-radius: 14px;
          --content-bg: #ffffff;
          --border-color: #dfe3ec;
          --header-bottom-border-color: #e5e7eb;

          --sidebar-expanded-width: 100%;
          --sidebar-collapsed-width: 0px;
          --sidebar-desktop-expanded-width: min(25vw, 220px);
          --sidebar-desktop-collapsed-width: 80px;
          --sidebar-menu-item-size: 48px;

          --toggle-size: 42px;
          --transition-speed: 220ms;

          --sidebar-bg: #202637;
          --sidebar-color: #ffffff;

          --text-error: #c0392b;
      }

      * {
          box-sizing: border-box;
      }

      html,
      body {
          width: 100%;
          min-width: var(--app-min-width);
          min-height: 100%;
          margin: 0;
          font-family: Arial, sans-serif;
          background: var(--page-bg);
      }

      body {
          min-height: 100vh;
      }

      #root {
          width: 100%;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
      }

      .app-header {
          position: relative;
          width: 100%;
          height: var(--header-height);
          max-height: 80px;
          flex: 0 0 var(--header-height);
          display: flex;
          align-items: stretch;
          justify-content: space-between;
          gap: 12px;
          padding: 8px 12px;
          background: var(--header-bg);
          color: var(--header-color);
          border-bottom: 1px solid var(--header-bottom-border-color);
      }

      .app-brand {
          min-width: 0;
          flex: 1 1 auto;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          justify-content: center;
          gap: 4px;
      }

      .app-logo {
          width: 140px;
          height: 14px;
          flex: 0 0 auto;
          display: block;
      }

      .app-title {
          margin: 0;
          font-size: 18px;
          font-weight: 700;
          white-space: nowrap;
      }

      .app-brand h1 {
          display: none;
      }

      .app-header-actions {
          flex: 0 0 auto;
          display: flex;
          align-items: center;
          justify-content: flex-end;
          gap: 8px;
      }

      .app-header-link {
          border: 0;
          background: transparent;
          color: var(--header-color);
          font-size: 13px;
          cursor: pointer;
      }

      .app-header-link:hover {
          text-decoration: underline;
      }

      .app-client-name {
          position: absolute;
          left: 12px;
          bottom: 8px;
          color: var(--header-color);
          font-size: 12px;
          font-weight: 600;
          white-space: nowrap;
      }

      .app-main {
          min-height: calc(100vh - var(--header-height));
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 16px;
          overflow: auto;
      }

      .login-card {
          width: 100%;
          max-width: 380px;
          min-height: 260px;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          border: 1px solid var(--card-border);
          border-radius: var(--card-radius);
          background: var(--card-bg);
      }

      .login-form {
          width: 100%;
          display: flex;
          flex-direction: column;
          gap: 16px;
      }

      .login-form-title {
          margin: 0 0 4px;
          color: #151923;
          font-size: 22px;
          font-weight: 700;
          text-align: center;
      }

      .login-form-subtitle {
          margin: 0 0 8px;
          color: #667085;
          font-size: 14px;
          line-height: 1.4;
          text-align: center;
      }

      .login-field {
          display: flex;
          flex-direction: column;
          gap: 6px;
      }

      .login-label {
          color: #344054;
          font-size: 14px;
          font-weight: 600;
      }

      .login-input {
          width: 100%;
          height: 44px;
          padding: 0 12px;
          border: 1px solid var(--card-border);
          border-radius: 10px;
          background: #ffffff;
          color: #151923;
          font-size: 15px;
          outline: none;
          transition:
                  border-color var(--transition-speed) ease,
                  box-shadow var(--transition-speed) ease;
      }

      .login-input:focus {
          border-color: #667085;
          box-shadow: 0 0 0 3px rgba(102, 112, 133, 0.14);
      }

      .login-submit {
          width: 100%;
          height: 46px;
          margin-top: 4px;
          border: 0;
          border-radius: 10px;
          background: #151923;
          color: #ffffff;
          font-size: 15px;
          font-weight: 700;
          cursor: pointer;
          transition:
                  background var(--transition-speed) ease,
                  transform var(--transition-speed) ease;
      }

      .login-submit:hover {
          background: #252c3a;
      }

      .login-submit:active {
          transform: translateY(1px);
      }

      .login-error {
          min-height: 18px;
          margin: -4px 0 0;
          color: var(--text-error);
          font-size: 13px;
          line-height: 1.4;
          text-align: center;
      }

      .sidebar-state {
          position: absolute;
          width: 1px;
          height: 1px;
          opacity: 0;
          pointer-events: none;
      }

      .mobile-sidebar-toggle {
          box-shadow: 0 -2px 24px 0 rgba(24, 36, 51, 0.1);
          width: var(--toggle-size);
          height: var(--toggle-size);
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 999px;
          background: #ffffff;
          color: #151923;
          font-size: 22px;
          line-height: 1;
          cursor: pointer;
          user-select: none;
      }

      .desktop-sidebar-toggle {
          display: none;
      }

      .app-shell {
          position: relative;
          min-height: calc(100vh - var(--header-height));
          flex: 1 1 auto;
          display: flex;
          overflow: hidden;
      }

      .sidebar {
          width: var(--sidebar-collapsed-width);
          flex: 0 0 var(--sidebar-collapsed-width);
          min-height: calc(100vh - var(--header-height));
          overflow: hidden;
          background: var(--sidebar-bg);
          color: var(--sidebar-color);
          transition:
                  width var(--transition-speed) ease,
                  flex-basis var(--transition-speed) ease;
      }

      .sidebar-inner {
          width: 100vw;
          max-width: 320px;
          min-height: 100%;
          padding: 16px;
          opacity: 0;
          transition:
                  width var(--transition-speed) ease,
                  max-width var(--transition-speed) ease,
                  opacity var(--transition-speed) ease;
      }

      .sidebar-heading {
          margin: 0 0 16px;
          font-size: 16px;
          font-weight: 700;
          transition:
                  opacity var(--transition-speed) ease,
                  height var(--transition-speed) ease,
                  margin var(--transition-speed) ease;
      }

      .sidebar-menu {
          display: flex;
          flex-direction: column;
          gap: 8px;
      }

      .sidebar-menu-button {
          width: 100%;
          min-width: 188px;
          height: 48px;
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 0 14px;
          border: 0;
          border-radius: 12px;
          background: transparent;
          color: #c8d0e0;
          font-size: 15px;
          font-weight: 600;
          text-align: left;
          cursor: pointer;
          overflow: hidden;
          transition:
                  width var(--transition-speed) ease,
                  min-width var(--transition-speed) ease,
                  max-width var(--transition-speed) ease,
                  padding var(--transition-speed) ease,
                  background var(--transition-speed) ease,
                  color var(--transition-speed) ease;
      }

      .sidebar-menu-button:hover {
          background: rgba(255, 255, 255, 0.08);
          color: #ffffff;
      }

      .sidebar-menu-button-active {
          background: rgba(255, 255, 255, 0.14);
          color: #ffffff;
      }

      .sidebar-menu-icon {
          width: 22px;
          height: 22px;
          flex: 0 0 22px;
          display: block;
      }

      .sidebar-menu-label {
          white-space: nowrap;
          transition:
                  width var(--transition-speed) ease,
                  opacity var(--transition-speed) ease;
      }

      .sidebar-placeholder {
          margin: 0;
          color: #c8d0e0;
          font-size: 14px;
          line-height: 1.5;
      }

      .content {
          min-width: 0;
          min-height: calc(100vh - var(--header-height));
          flex: 1 1 auto;
          padding: 16px;
          overflow: auto;
          background: var(--content-bg);
      }

      .page-grid {
          display: flex;
          flex-direction: column;
          gap: 16px;
      }

      .content-card {
          min-height: 240px;
          padding: 16px;
          border: 1px solid var(--border-color);
          border-radius: 14px;
          background: #ffffff;
      }

      .content-title {
          margin: 0 0 16px;
          color: #151923;
          font-size: 20px;
      }

      .content-text {
          margin: 0;
          color: #667085;
          line-height: 1.5;
      }

      .info-list {
          display: flex;
          flex-direction: column;
          gap: 12px;
      }

      .info-row {
          display: flex;
          flex-direction: column;
          gap: 4px;
          padding: 12px;
          border: 1px solid var(--border-color);
          border-radius: 10px;
          background: #f8fafc;
      }

      .info-label {
          color: #667085;
          font-size: 13px;
      }

      .info-value {
          color: #151923;
          font-size: 15px;
          font-weight: 700;
      }

      .accounts-list {
          display: flex;
          flex-direction: column;
          gap: 12px;
      }

      .account-card {
          display: flex;
          justify-content: space-between;
          gap: 16px;
          padding: 14px;
          border: 1px solid var(--border-color);
          border-radius: 12px;
          background: #f8fafc;
      }

      .account-name {
          margin: 0 0 4px;
          color: #151923;
          font-size: 15px;
          font-weight: 700;
      }

      .account-meta {
          margin: 0;
          color: #667085;
          font-size: 13px;
      }

      .account-balance {
          color: #151923;
          font-size: 15px;
          font-weight: 700;
          white-space: nowrap;
      }

      .terminal-placeholder {
          min-height: 360px;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 1px dashed #98a2b3;
          border-radius: 12px;
          background: #f8fafc;
          color: #667085;
          text-align: center;
      }

      .sidebar-state:checked ~ .app-shell .sidebar {
          width: var(--sidebar-expanded-width);
          flex-basis: var(--sidebar-expanded-width);
      }

      .sidebar-state:checked ~ .app-shell .sidebar-inner {
          opacity: 1;
      }

      @media (min-width: 600px) {
          :root {
              --header-height: 68px;
          }

          .app-header {
              align-items: center;
              padding: 0 24px;
          }

          .app-brand {
              flex-direction: row;
              align-items: center;
              justify-content: flex-start;
              gap: 10px;
          }

          .app-brand h1 {
              display: block;
          }

          .app-logo {
              width: 180px;
              height: 18px;
          }

          .app-header-actions {
              gap: 10px;
          }

          .app-header-link {
              font-size: 14px;
          }

          .app-client-name {
              position: static;
              font-size: 14px;
          }

          .app-main {
              padding: 24px;
          }

          .content {
              padding: 24px;
          }
      }

      @media (min-width: 1024px) {
          .login-card {
              max-width: 420px;
          }

          .mobile-sidebar-toggle {
              display: none;
          }

          .desktop-sidebar-toggle {
              position: absolute;
              top: 24px;
              left: calc(var(--sidebar-desktop-collapsed-width) - (var(--toggle-size) / 2));
              width: var(--toggle-size);
              height: var(--toggle-size);
              display: flex;
              align-items: center;
              justify-content: center;
              border: 1px solid var(--border-color);
              border-radius: 999px;
              background: #ffffff;
              color: #151923;
              font-size: 22px;
              line-height: 1;
              cursor: pointer;
              user-select: none;
              z-index: 4;
              transition:
                      left var(--transition-speed) ease,
                      transform var(--transition-speed) ease;
          }

          .sidebar {
              width: var(--sidebar-desktop-collapsed-width);
              flex-basis: var(--sidebar-desktop-collapsed-width);
          }

          .sidebar-inner {
              width: var(--sidebar-desktop-expanded-width);
              max-width: var(--sidebar-desktop-expanded-width);
              opacity: 1;
          }

          .content {
              width: auto;
              height: calc(100vh - var(--header-height));
          }

          .sidebar-state:checked ~ .app-shell .sidebar {
              width: var(--sidebar-desktop-expanded-width);
              flex-basis: var(--sidebar-desktop-expanded-width);
          }

          .sidebar-state:checked ~ .app-shell .desktop-sidebar-toggle {
              left: calc(var(--sidebar-desktop-expanded-width) - (var(--toggle-size) / 2));
          }

          .sidebar-state:not(:checked) ~ .app-shell .desktop-sidebar-toggle {
              transform: rotate(180deg);
          }

          .sidebar-state:not(:checked) ~ .app-shell .sidebar-inner {
              width: var(--sidebar-desktop-collapsed-width);
              max-width: var(--sidebar-desktop-collapsed-width);
              padding: 16px;
          }

          .sidebar-state:not(:checked) ~ .app-shell .sidebar-heading {
              height: 0;
              margin: 0;
              opacity: 0;
              overflow: hidden;
          }

          .sidebar-state:not(:checked) ~ .app-shell .sidebar-menu {
              align-items: center;
              gap: 16px;
          }

          .sidebar-state:not(:checked) ~ .app-shell .sidebar-menu-button {
              width: var(--sidebar-menu-item-size);
              min-width: var(--sidebar-menu-item-size);
              max-width: var(--sidebar-menu-item-size);
              height: var(--sidebar-menu-item-size);
              justify-content: center;
              gap: 0;
              padding: 0;
              border-radius: 16px;
          }

          .sidebar-state:not(:checked) ~ .app-shell .sidebar-menu-label {
              width: 0;
              opacity: 0;
              overflow: hidden;
          }
      }

      @media (min-width: 1440px) {
          .login-card {
              max-width: 460px;
          }

          .content {
              padding: 32px;
          }
      }

      @media (min-width: 1920px) {
          .login-card {
              max-width: 500px;
          }

          .content-card {
              min-height: 320px;
          }
      }
  </style>
</head>

<body>
<div id="root"></div>

<script>
  const rootElement = document.getElementById('root');

  const appStorage = (() => {
    const stateKey = 'client_portal_state_v1';

    const defaultState = {
      route: 'login',
      sidebarExpanded: false,
      isAuthenticated: false,
      clientName: null
    };

    const parseJson = (rawValue) => {
      try {
        return JSON.parse(rawValue);
      } catch {
        console.warn('JSON parsing failed for storage');
        return {};
      }
    };

    const readState = () => {
      const rawValue = localStorage.getItem(stateKey);

      if (!rawValue) {
        return {
          ...defaultState
        };
      }

      return {
        ...defaultState,
        ...parseJson(rawValue)
      };
    };

    const writeState = (state) => {
      localStorage.setItem(stateKey, JSON.stringify(state));
    };

    const getState = () => {
      return readState();
    };

    const setState = (partialState) => {
      const nextState = {
        ...getState(),
        ...partialState
      };

      writeState(nextState);

      return nextState;
    };

    return {
      getState,
      setState
    };
  })();

  const routes = {
    login: 'login',
    profile: 'profile',
    accounts: 'accounts',
    terminal: 'terminal'
  };

  const protectedRoutes = [
    routes.profile,
    routes.accounts,
    routes.terminal
  ];

  const menuItems = [
    {
      route: routes.profile,
      label: 'Profile',
      icon: 'images/profile-icon.svg'
    },
    {
      route: routes.accounts,
      label: 'Accounts',
      icon: 'images/accounts-icon.svg'
    },
    {
      route: routes.terminal,
      label: 'Terminal',
      icon: 'images/trade-icon.svg'
    }
  ];

  const isProtectedRoute = (route) => {
    return protectedRoutes.includes(route);
  };

  const loginCredentials = {
    login: 'testLogin',
    password: 'testPassword'
  };

  const loginUser = (login, password) => {
    const isValidUser = login === loginCredentials.login && password === loginCredentials.password;

    if (!isValidUser) {
      return false;
    }

    appStorage.setState({
      route: routes.terminal,
      isAuthenticated: true,
      clientName: login
    });

    return true;
  };

  const logoutUser = () => {
    appStorage.setState({
      route: routes.login,
      isAuthenticated: false,
      clientName: null,
      sidebarExpanded: false
    });

    if (window.location.hash !== `#${routes.login}`) {
      window.location.hash = routes.login;
      return;
    }

    renderApp();
  };

  const getRouteFromHash = () => {
    const route = window.location.hash.replace('#', '').trim();

    if (!route) {
      return null;
    }

    return route;
  };

  const getCurrentRoute = () => {
    const routeFromHash = getRouteFromHash();

    if (routeFromHash) {
      return routeFromHash;
    }

    return appStorage.getState().route || routes.login;
  };

  const navigateTo = (route) => {
    appStorage.setState({
      route
    });

    if (window.location.hash !== `#${route}`) {
      window.location.hash = route;
      return;
    }

    renderApp();
  };

  const appendChildren = (parentElement, children) => {
    children.flat(Infinity).forEach((child) => {
      if (child === null || child === undefined || child === false) {
        return;
      }

      if (typeof child === 'string' || typeof child === 'number') {
        parentElement.append(document.createTextNode(String(child)));
        return;
      }

      parentElement.append(child);
    });
  };

  const createElement = (tagName, options = {}, children = []) => {
    const element = document.createElement(tagName);

    Object.entries(options).forEach(([key, value]) => {
      if (key === 'className') {
        element.className = value;
        return;
      }

      if (key === 'textContent') {
        element.textContent = value;
        return;
      }

      if (key === 'htmlFor') {
        element.htmlFor = value;
        return;
      }

      if (key === 'checked') {
        element.checked = Boolean(value);
        return;
      }

      if (key === 'disabled') {
        element.disabled = Boolean(value);
        return;
      }

      if (value === null || value === undefined || value === false) {
        return;
      }

      if (key.startsWith('on') && typeof value === 'function') {
        const eventName = key.slice(2).toLowerCase();
        element.addEventListener(eventName, value);
        return;
      }

      element.setAttribute(key, String(value));
    });

    appendChildren(element, children);

    return element;
  };

  const createAppBrand = () => {
    return createElement('div', {
      className: 'app-brand'
    }, [
      createElement('img', {
        className: 'app-logo',
        src: 'images/oneroyal-logo.svg',
        alt: 'Client Portal logo'
      }),

      createElement('h1', {
        className: 'app-title',
        textContent: 'Client Portal'
      })
    ]);
  };

  const createAppHeader = () => {
    return createElement('header', {
      className: 'app-header'
    }, [
      createAppBrand()
    ]);
  };

  const createLoginMain = () => {
    return createElement('main', {
      className: 'app-main'
    }, [
      createElement('section', {
        className: 'login-card'
      }, [
        createElement('form', {
          className: 'login-form',
          onSubmit: (event) => {
            event.preventDefault();

            const formData = new FormData(event.currentTarget);
            const login = String(formData.get('login') || '').trim();
            const password = String(formData.get('password') || '');
            const errorElement = event.currentTarget.querySelector('#login_error');
            const isLoggedIn = loginUser(login, password);

            if (!isLoggedIn) {
              if (errorElement) {
                errorElement.textContent = 'Invalid login or password';
              }

              return;
            }

            navigateTo(routes.terminal);
          }
        }, [
          createElement('h2', {
            className: 'login-form-title',
            textContent: 'Login'
          }),

          createElement('p', {
            className: 'login-form-subtitle',
            textContent: 'Use testLogin and testPassword to continue.'
          }),

          createElement('div', {
            className: 'login-field'
          }, [
            createElement('label', {
              className: 'login-label',
              htmlFor: 'login_username',
              textContent: 'Login'
            }),

            createElement('input', {
              className: 'login-input',
              id: 'login_username',
              name: 'login',
              type: 'text',
              autocomplete: 'username',
              placeholder: 'Enter login',
              required: true
            })
          ]),

          createElement('div', {
            className: 'login-field'
          }, [
            createElement('label', {
              className: 'login-label',
              htmlFor: 'login_password',
              textContent: 'Password'
            }),

            createElement('input', {
              className: 'login-input',
              id: 'login_password',
              name: 'password',
              type: 'password',
              autocomplete: 'current-password',
              placeholder: 'Enter password',
              required: true
            })
          ]),

          createElement('p', {
            className: 'login-error',
            id: 'login_error',
            role: 'alert'
          }),

          createElement('button', {
            className: 'login-submit',
            type: 'submit',
            textContent: 'Submit'
          })
        ])
      ])
    ]);
  };

  const renderLoginPage = () => {
    return [
      createAppHeader(),
      createLoginMain()
    ];
  };

  const createSidebarHeader = () => {
    const appState = appStorage.getState();
    const clientName = appState.clientName || 'Client';

    return createElement('header', {
      className: 'app-header'
    }, [
      createAppBrand(),

      createElement('div', {
        className: 'app-header-actions'
      }, [
        createElement('span', {
          className: 'app-client-name',
          textContent: `Hello, ${clientName}!`
        }),

        createElement('button', {
          className: 'app-header-link',
          type: 'button',
          textContent: 'Logout',
          onClick: () => {
            logoutUser();
          }
        }),

        createElement('label', {
          className: 'mobile-sidebar-toggle',
          htmlFor: 'sidebar_state',
          'aria-label': 'Toggle sidebar',
          textContent: '☰'
        })
      ])
    ]);
  };

  const createSidebarMenu = (activeRoute) => {
    return createElement('nav', {
      className: 'sidebar-menu',
      'aria-label': 'Main menu'
    }, menuItems.map((item) => {
      const isActive = item.route === activeRoute;

      return createElement('button', {
        className: isActive
          ? 'sidebar-menu-button sidebar-menu-button-active'
          : 'sidebar-menu-button',
        type: 'button',
        onClick: () => {
          navigateTo(item.route);
        }
      }, [
        createElement('img', {
          className: 'sidebar-menu-icon',
          src: item.icon,
          alt: ''
        }),

        createElement('span', {
          className: 'sidebar-menu-label',
          textContent: item.label
        })
      ]);
    }));
  };

  const createContentCard = (title, children) => {
    return createElement('section', {
      className: 'content-card'
    }, [
      createElement('h2', {
        className: 'content-title',
        textContent: title
      }),

      ...children
    ]);
  };

  const createProfilePage = () => {
    const appState = appStorage.getState();
    const clientName = appState.clientName || 'Client';

    return createContentCard('Profile', [
      createElement('div', {
        className: 'info-list'
      }, [
        createElement('div', {
          className: 'info-row'
        }, [
          createElement('span', {
            className: 'info-label',
            textContent: 'Client Name'
          }),

          createElement('span', {
            className: 'info-value',
            textContent: clientName
          })
        ]),

        createElement('div', {
          className: 'info-row'
        }, [
          createElement('span', {
            className: 'info-label',
            textContent: 'Status'
          }),

          createElement('span', {
            className: 'info-value',
            textContent: 'Verified'
          })
        ]),

        createElement('div', {
          className: 'info-row'
        }, [
          createElement('span', {
            className: 'info-label',
            textContent: 'Account Type'
          }),

          createElement('span', {
            className: 'info-value',
            textContent: 'Demo Client'
          })
        ])
      ])
    ]);
  };

  const createAccountsPage = () => {
    return createContentCard('Accounts', [
      createElement('div', {
        className: 'accounts-list'
      }, [
        createElement('div', {
          className: 'account-card'
        }, [
          createElement('div', {}, [
            createElement('p', {
              className: 'account-name',
              textContent: 'Trading Account'
            }),

            createElement('p', {
              className: 'account-meta',
              textContent: 'USD - Demo'
            })
          ]),

          createElement('strong', {
            className: 'account-balance',
            textContent: '$10,000.00'
          })
        ]),

        createElement('div', {
          className: 'account-card'
        }, [
          createElement('div', {}, [
            createElement('p', {
              className: 'account-name',
              textContent: 'Investment Account'
            }),

            createElement('p', {
              className: 'account-meta',
              textContent: 'EUR - Demo'
            })
          ]),

          createElement('strong', {
            className: 'account-balance',
            textContent: '€5,250.00'
          })
        ])
      ])
    ]);
  };

  const createTerminalPage = () => {
    return createContentCard('Terminal', [
      createElement('div', {
        className: 'terminal-placeholder',
        id: 'terminal_container'
      }, [
        createElement('p', {
          className: 'content-text',
          textContent: 'TradingView chart will be loaded here when Terminal is opened.'
        })
      ])
    ]);
  };

  const createPageContent = (route) => {
    if (route === routes.accounts) {
      return createAccountsPage();
    }

    if (route === routes.terminal) {
      return createTerminalPage();
    }

    return createProfilePage();
  };

  const createSidebarLayout = () => {
    const appState = appStorage.getState();
    const activeRoute = isProtectedRoute(appState.route)
      ? appState.route
      : routes.profile;

    return [
      createElement('input', {
        className: 'sidebar-state',
        id: 'sidebar_state',
        type: 'checkbox',
        checked: appState.sidebarExpanded,
        onChange: (event) => {
          appStorage.setState({
            sidebarExpanded: event.currentTarget.checked
          });
        }
      }),

      createSidebarHeader(),

      createElement('div', {
        className: 'app-shell'
      }, [
        createElement('aside', {
          className: 'sidebar'
        }, [
          createElement('div', {
            className: 'sidebar-inner'
          }, [
            createElement('h2', {
              className: 'sidebar-heading',
              textContent: 'Menu'
            }),

            createSidebarMenu(activeRoute)
          ])
        ]),

        createElement('label', {
          className: 'desktop-sidebar-toggle',
          htmlFor: 'sidebar_state',
          'aria-label': 'Toggle sidebar',
          textContent: '‹'
        }),

        createElement('main', {
          className: 'content'
        }, [
          createElement('div', {
            className: 'page-grid'
          }, [
            createPageContent(activeRoute)
          ])
        ])
      ])
    ];
  };

  const renderApp = () => {
    const route = getCurrentRoute();
    const appState = appStorage.getState();

    if (!appState.isAuthenticated) {
      appStorage.setState({
        route: routes.login
      });

      if (window.location.hash !== `#${routes.login}`) {
        window.location.hash = routes.login;
        return;
      }

      rootElement.replaceChildren(...renderLoginPage());
      return;
    }

    if (route === routes.login) {
      const savedRoute = isProtectedRoute(appState.route)
        ? appState.route
        : routes.profile;

      navigateTo(savedRoute);
      return;
    }

    const nextRoute = isProtectedRoute(route)
      ? route
      : routes.profile;

    appStorage.setState({
      route: nextRoute
    });

    if (window.location.hash !== `#${nextRoute}`) {
      window.location.hash = nextRoute;
      return;
    }

    rootElement.replaceChildren(...createSidebarLayout());
  };

  window.addEventListener('hashchange', renderApp);

  const initialRoute = getCurrentRoute();

  if (!window.location.hash) {
    window.location.hash = initialRoute;
  } else {
    renderApp();
  }
</script>
</body>
</html>
