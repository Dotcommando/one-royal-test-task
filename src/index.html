<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Portal</title>

  <style>
      :root {
          --q-screen-xs-min: 0px;
          --q-screen-sm-min: 600px;
          --q-screen-md-min: 1024px;
          --q-screen-lg-min: 1440px;
          --q-screen-xl-min: 1920px;

          --app-min-width: 320px;
          --header-height: 80px;
          --card-radius: 14px;
          --content-padding: 16px;
          --content-vertical-padding: 32px;

          --sidebar-expanded-width: 100%;
          --sidebar-collapsed-width: 0px;
          --sidebar-desktop-expanded-width: min(25vw, 220px);
          --sidebar-desktop-collapsed-width: 80px;
          --sidebar-menu-item-size: 48px;

          --toggle-size: 42px;
          --transition-speed: 220ms;

          --text-error: #c0392b;
          --chart-text-color: #374151;
          --chart-grid-color: #eef2f7;
          --chart-border-color: #dfe3ec;
          --chart-up-color: #16a34a;
          --chart-down-color: #dc2626;
      }


      :root,
      :root[data-theme="light"] {
          --page-bg: #f4f6fb;
          --header-bg: #f9fafb;
          --header-color: #374151;
          --header-bottom-border-color: #e5e7eb;
          --card-bg: #ffffff;
          --card-border: #dfe3ec;
          --content-bg: #ffffff;
          --border-color: #dfe3ec;
          --text-primary: #151923;
          --text-secondary: #667085;
          --text-muted: #344054;
          --input-bg: #ffffff;
          --input-border: #dfe3ec;
          --input-focus: #667085;
          --input-focus-shadow: rgba(102, 112, 133, 0.14);
          --button-primary-bg: #151923;
          --button-primary-hover-bg: #252c3a;
          --button-primary-text: #ffffff;
          --surface-muted: #f8fafc;
          --toggle-bg: #ffffff;
          --toggle-border: #dfe3ec;
          --toggle-icon: #151923;
          --sidebar-bg: #eef2f8;
          --sidebar-border: #dde4ef;
          --sidebar-color: #334155;
          --sidebar-heading-color: #111827;
          --sidebar-menu-color: #5b667a;
          --sidebar-menu-hover-bg: #e3eaf4;
          --sidebar-menu-hover-color: #1f2937;
          --sidebar-menu-active-bg: #d4ddeb;
          --sidebar-menu-active-color: #111827;
          --sidebar-divider: #d6deea;
          --chart-bg: #ffffff;
      }


      :root[data-theme="dark"] {
          --page-bg: #0f1723;
          --header-bg: #121b2b;
          --header-color: #e5e7eb;
          --header-bottom-border-color: #253047;
          --card-bg: #162132;
          --card-border: #273246;
          --content-bg: #0f1723;
          --border-color: #273246;
          --text-primary: #f3f4f6;
          --text-secondary: #94a3b8;
          --text-muted: #cbd5e1;
          --input-bg: #101827;
          --input-border: #334155;
          --input-focus: #64748b;
          --input-focus-shadow: rgba(100, 116, 139, 0.18);
          --button-primary-bg: #e2e8f0;
          --button-primary-hover-bg: #cbd5e1;
          --button-primary-text: #0f1723;
          --surface-muted: #1a2639;
          --toggle-bg: #162132;
          --toggle-border: #334155;
          --toggle-icon: #f3f4f6;
          --sidebar-bg: #202637;
          --sidebar-border: #2a3144;
          --sidebar-color: #ffffff;
          --sidebar-heading-color: #ffffff;
          --sidebar-menu-color: #c8d0e0;
          --sidebar-menu-hover-bg: rgba(255, 255, 255, 0.08);
          --sidebar-menu-hover-color: #ffffff;
          --sidebar-menu-active-bg: rgba(255, 255, 255, 0.14);
          --sidebar-menu-active-color: #ffffff;
          --sidebar-divider: rgba(200, 208, 224, 0.18);
          --chart-bg: #bcc8dd;
      }

      * {
          box-sizing: border-box;
      }

      html,
      body {
          width: 100%;
          min-width: var(--app-min-width);
          min-height: 100%;
          margin: 0;
          font-family: Arial, sans-serif;
          background: var(--page-bg);
          color: var(--text-primary);
      }

      body {
          min-height: 100vh;
      }

      #root {
          width: 100%;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
      }

      .app-header {
          position: relative;
          width: 100%;
          height: var(--header-height);
          max-height: 80px;
          flex: 0 0 var(--header-height);
          display: flex;
          align-items: stretch;
          justify-content: space-between;
          gap: 12px;
          padding: 8px 12px;
          background: var(--header-bg);
          color: var(--header-color);
          border-bottom: 1px solid var(--header-bottom-border-color);
      }

      .app-brand {
          min-width: 0;
          flex: 1 1 auto;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          justify-content: center;
          gap: 4px;
      }

      .app-logo {
          width: 140px;
          height: 14px;
          flex: 0 0 auto;
          display: block;
      }

      .app-title {
          margin: 0;
          font-size: 18px;
          font-weight: 700;
          white-space: nowrap;
      }

      .app-brand h1 {
          display: none;
      }

      .app-header-actions {
          flex: 0 0 auto;
          display: flex;
          align-items: center;
          justify-content: flex-end;
          gap: 8px;
      }

      .app-header-link {
          border: 0;
          background: transparent;
          color: var(--header-color);
          font-size: 13px;
          cursor: pointer;
      }

      .app-header-link:hover {
          text-decoration: underline;
      }

      .app-client-name {
          position: absolute;
          left: 12px;
          bottom: 8px;
          color: var(--header-color);
          font-size: 12px;
          font-weight: 600;
          white-space: nowrap;
      }

      .app-main {
          min-height: calc(100vh - var(--header-height));
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 16px;
          overflow: auto;
      }

      .login-card {
          width: 100%;
          max-width: 380px;
          min-height: 260px;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          border: 1px solid var(--card-border);
          border-radius: var(--card-radius);
          background: var(--card-bg);
      }

      .login-form {
          width: 100%;
          display: flex;
          flex-direction: column;
          gap: 16px;
      }

      .login-form-title {
          margin: 0 0 4px;
          color: var(--text-primary);
          font-size: 22px;
          font-weight: 700;
          text-align: center;
      }

      .login-form-subtitle {
          margin: 0 0 8px;
          color: var(--text-secondary);
          font-size: 14px;
          line-height: 1.4;
          text-align: center;
      }

      .login-field {
          display: flex;
          flex-direction: column;
          gap: 6px;
      }

      .login-label {
          color: var(--text-muted);
          font-size: 14px;
          font-weight: 600;
      }

      .login-input {
          width: 100%;
          height: 44px;
          padding: 0 12px;
          border: 1px solid var(--input-border);
          border-radius: 10px;
          background: var(--input-bg);
          color: var(--text-primary);
          font-size: 15px;
          outline: none;
          transition:
                  border-color var(--transition-speed) ease,
                  box-shadow var(--transition-speed) ease;
      }

      .login-input:focus {
          border-color: var(--input-focus);
          box-shadow: 0 0 0 3px var(--input-focus-shadow);
      }

      .login-input::placeholder {
          color: var(--text-secondary);
      }

      .login-submit {
          width: 100%;
          height: 46px;
          margin-top: 4px;
          border: 0;
          border-radius: 10px;
          background: var(--button-primary-bg);
          color: var(--button-primary-text);
          font-size: 15px;
          font-weight: 700;
          cursor: pointer;
          transition:
                  background var(--transition-speed) ease,
                  transform var(--transition-speed) ease;
      }

      .login-submit:hover {
          background: var(--button-primary-hover-bg);
      }

      .login-submit:active {
          transform: translateY(1px);
      }

      .login-error {
          min-height: 18px;
          margin: -4px 0 0;
          color: var(--text-error);
          font-size: 13px;
          line-height: 1.4;
          text-align: center;
      }

      .sidebar-state {
          position: absolute;
          width: 1px;
          height: 1px;
          opacity: 0;
          pointer-events: none;
      }

      .mobile-sidebar-toggle {
          width: var(--toggle-size);
          height: var(--toggle-size);
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 999px;
          background: var(--toggle-bg);
          color: var(--toggle-icon);
          font-size: 22px;
          line-height: 1;
          cursor: pointer;
          user-select: none;
          border: 1px solid var(--toggle-border);
      }

      .desktop-sidebar-toggle {
          display: none;
      }

      .app-shell {
          position: relative;
          min-height: calc(100vh - var(--header-height));
          flex: 1 1 auto;
          display: flex;
          overflow: hidden;
      }

      .sidebar {
          width: var(--sidebar-collapsed-width);
          flex: 0 0 var(--sidebar-collapsed-width);
          min-height: calc(100vh - var(--header-height));
          overflow: hidden;
          background: var(--sidebar-bg);
          color: var(--sidebar-color);
          border-right: 1px solid var(--sidebar-border);
          transition:
                  width var(--transition-speed) ease,
                  flex-basis var(--transition-speed) ease;
      }

      .sidebar-inner {
          width: 100vw;
          max-width: 320px;
          min-height: 100%;
          padding: 16px;
          opacity: 0;
          transition:
                  width var(--transition-speed) ease,
                  max-width var(--transition-speed) ease,
                  opacity var(--transition-speed) ease;
      }

      .sidebar-heading {
          margin: 0 0 16px;
          color: var(--sidebar-heading-color);
          font-size: 16px;
          font-weight: 700;
          transition:
                  opacity var(--transition-speed) ease,
                  height var(--transition-speed) ease,
                  margin var(--transition-speed) ease;
      }

      .sidebar-menu {
          display: flex;
          flex-direction: column;
          gap: 8px;
      }

      .sidebar-menu-divider {
          width: 100%;
          height: 1px;
          margin: 8px 0 4px;
          background: var(--sidebar-divider);
          transition:
                  width var(--transition-speed) ease,
                  opacity var(--transition-speed) ease;
      }

      .sidebar-menu-button {
          width: 100%;
          min-width: 188px;
          height: 48px;
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 0 14px;
          border: 0;
          border-radius: 12px;
          background: transparent;
          color: var(--sidebar-menu-color);
          font-size: 15px;
          font-weight: 600;
          text-align: left;
          cursor: pointer;
          overflow: hidden;
          transition:
                  width var(--transition-speed) ease,
                  min-width var(--transition-speed) ease,
                  max-width var(--transition-speed) ease,
                  padding var(--transition-speed) ease,
                  background var(--transition-speed) ease,
                  color var(--transition-speed) ease;
      }

      .sidebar-menu-button:hover {
          background: var(--sidebar-menu-hover-bg);
          color: var(--sidebar-menu-hover-color);
      }

      .sidebar-menu-button-active {
          background: var(--sidebar-menu-active-bg);
          color: var(--sidebar-menu-active-color);
      }

      .sidebar-menu-icon {
          width: 22px;
          height: 22px;
          flex: 0 0 22px;
          display: block;
      }

      .sidebar-menu-label {
          white-space: nowrap;
          transition:
                  width var(--transition-speed) ease,
                  opacity var(--transition-speed) ease;
      }

      .sidebar-theme-button {
          border: 1px solid transparent;
      }

      .sidebar-theme-button:hover,
      .sidebar-theme-button:focus-visible {
          border-color: var(--sidebar-divider);
          outline: none;
      }

      .content {
          min-width: 0;
          min-height: calc(100vh - var(--header-height));
          flex: 1 1 auto;
          padding: var(--content-padding);
          overflow: auto;
          background: var(--content-bg);
      }

      .page-grid {
          width: 100%;
          display: flex;
          flex-direction: column;
          gap: 16px;
      }

      .content-card {
          width: 100%;
          max-width: 1400px;
          min-height: 240px;
          margin: 0 auto;
          padding: 16px;
          border: 1px solid var(--border-color);
          border-radius: 14px;
          background: var(--card-bg);
      }

      .content-title {
          margin: 0 0 16px;
          color: var(--text-primary);
          font-size: 20px;
      }

      .content-text {
          margin: 0;
          color: var(--text-secondary);
          line-height: 1.5;
      }

      .info-list {
          display: flex;
          flex-direction: column;
          gap: 12px;
      }

      .info-row {
          display: flex;
          flex-direction: column;
          gap: 4px;
          padding: 12px;
          border: 1px solid var(--border-color);
          border-radius: 10px;
          background: var(--surface-muted);
      }

      .info-label {
          color: var(--text-secondary);
          font-size: 13px;
      }

      .info-value {
          color: var(--text-primary);
          font-size: 15px;
          font-weight: 700;
      }

      .accounts-list {
          display: flex;
          flex-direction: column;
          gap: 12px;
      }

      .account-card {
          display: flex;
          justify-content: space-between;
          gap: 16px;
          padding: 14px;
          border: 1px solid var(--border-color);
          border-radius: 12px;
          background: var(--surface-muted);
      }

      .account-name {
          margin: 0 0 4px;
          color: var(--text-primary);
          font-size: 15px;
          font-weight: 700;
      }

      .account-meta {
          margin: 0;
          color: var(--text-secondary);
          font-size: 13px;
      }

      .account-balance {
          color: var(--text-primary);
          font-size: 15px;
          font-weight: 700;
          white-space: nowrap;
      }

      .terminal-card {
          min-height: calc(100vh - var(--header-height) - var(--content-vertical-padding));
      }

      .terminal-toolbar {
          display: flex;
          flex-direction: column;
          gap: 12px;
          margin-bottom: 16px;
      }

      .terminal-control {
          display: flex;
          flex-direction: column;
          gap: 6px;
      }

      .terminal-label {
          color: var(--text-secondary);
          font-size: 13px;
          font-weight: 600;
      }

      .terminal-select {
          width: 100%;
          height: 42px;
          padding: 0 12px;
          border: 1px solid var(--input-border);
          border-radius: 10px;
          background: var(--input-bg);
          color: var(--text-primary);
          font-size: 14px;
          outline: none;
      }

      .terminal-price {
          display: flex;
          flex-direction: column;
          gap: 4px;
          padding: 10px 12px;
          border: 1px solid var(--border-color);
          border-radius: 10px;
          background: var(--surface-muted);
      }

      .terminal-price-label {
          color: var(--text-secondary);
          font-size: 12px;
      }

      .terminal-price-value {
          color: var(--text-primary);
          font-size: 18px;
          font-weight: 700;
      }

      .terminal-chart {
          width: 100%;
          height: 420px;
          min-height: 320px;
          border: 1px solid var(--border-color);
          border-radius: 14px;
          overflow: hidden;
          background: var(--chart-bg);
      }

      .terminal-status {
          margin: 10px 0 0;
          color: var(--text-secondary);
          font-size: 13px;
      }

      .sidebar-state:checked ~ .app-shell .sidebar {
          width: var(--sidebar-expanded-width);
          flex-basis: var(--sidebar-expanded-width);
      }

      .sidebar-state:checked ~ .app-shell .sidebar-inner {
          opacity: 1;
      }

      @media (min-width: 600px) {
          :root {
              --header-height: 68px;
              --content-padding: 24px;
              --content-vertical-padding: 48px;
          }

          .app-header {
              align-items: center;
              padding: 0 24px;
          }

          .app-brand {
              flex-direction: row;
              align-items: center;
              justify-content: flex-start;
              gap: 10px;
          }

          .app-brand h1 {
              display: block;
          }

          .app-logo {
              width: 180px;
              height: 18px;
          }

          .app-header-actions {
              gap: 10px;
          }

          .app-header-link {
              font-size: 14px;
          }

          .app-client-name {
              position: static;
              font-size: 14px;
          }

          .app-main {
              padding: 24px;
          }

          .content-card {
              padding: 24px;
          }

          .terminal-toolbar {
              flex-direction: row;
              align-items: flex-end;
              justify-content: space-between;
          }

          .terminal-control {
              width: 220px;
          }

          .terminal-price {
              min-width: 180px;
          }
      }

      @media (min-width: 1024px) {
          .login-card {
              max-width: 420px;
          }

          .mobile-sidebar-toggle {
              display: none;
          }

          .desktop-sidebar-toggle {
              position: absolute;
              top: 24px;
              left: calc(var(--sidebar-desktop-collapsed-width) - (var(--toggle-size) / 2));
              width: var(--toggle-size);
              height: var(--toggle-size);
              display: flex;
              align-items: center;
              justify-content: center;
              border: 1px solid var(--toggle-border);
              border-radius: 999px;
              background: var(--toggle-bg);
              color: var(--toggle-icon);
              cursor: pointer;
              user-select: none;
              z-index: 4;
              transition:
                      left var(--transition-speed) ease,
                      transform var(--transition-speed) ease;
          }

          .desktop-sidebar-toggle::before {
              margin: 0 0 0 2px;
              content: "";
              width: 8px;
              height: 8px;
              border-left: 2.5px solid var(--toggle-icon);
              border-bottom: 2.5px solid var(--toggle-icon);
              transform: rotate(45deg);
              transform-origin: center;
          }

          .sidebar {
              width: var(--sidebar-desktop-collapsed-width);
              flex-basis: var(--sidebar-desktop-collapsed-width);
          }

          .sidebar-inner {
              width: var(--sidebar-desktop-expanded-width);
              max-width: var(--sidebar-desktop-expanded-width);
              opacity: 1;
          }

          .content {
              width: auto;
              height: calc(100vh - var(--header-height));
          }

          .terminal-chart {
              height: 520px;
          }

          .sidebar-state:checked ~ .app-shell .sidebar {
              width: var(--sidebar-desktop-expanded-width);
              flex-basis: var(--sidebar-desktop-expanded-width);
          }

          .sidebar-state:checked ~ .app-shell .desktop-sidebar-toggle {
              left: calc(var(--sidebar-desktop-expanded-width) - (var(--toggle-size) / 2));
          }

          .sidebar-state:not(:checked) ~ .app-shell .desktop-sidebar-toggle {
              transform: rotate(180deg);
          }

          .sidebar-state:not(:checked) ~ .app-shell .sidebar-inner {
              width: var(--sidebar-desktop-collapsed-width);
              max-width: var(--sidebar-desktop-collapsed-width);
              padding: 16px;
          }

          .sidebar-state:not(:checked) ~ .app-shell .sidebar-heading {
              height: 0;
              margin: 0;
              opacity: 0;
              overflow: hidden;
          }

          .sidebar-state:not(:checked) ~ .app-shell .sidebar-menu {
              align-items: center;
              gap: 16px;
          }

          .sidebar-state:not(:checked) ~ .app-shell .sidebar-menu-divider {
              width: 32px;
          }

          .sidebar-state:not(:checked) ~ .app-shell .sidebar-menu-button {
              width: var(--sidebar-menu-item-size);
              min-width: var(--sidebar-menu-item-size);
              max-width: var(--sidebar-menu-item-size);
              height: var(--sidebar-menu-item-size);
              justify-content: center;
              gap: 0;
              padding: 0;
              border-radius: 16px;
          }

          .sidebar-state:not(:checked) ~ .app-shell .sidebar-menu-label {
              width: 0;
              opacity: 0;
              overflow: hidden;
          }
      }

      @media (min-width: 1440px) {
          :root {
              --content-padding: 32px;
              --content-vertical-padding: 64px;
          }

          .login-card {
              max-width: 460px;
          }

          .content-card {
              padding: 32px;
          }
      }

      @media (min-width: 1920px) {
          .login-card {
              max-width: 500px;
          }

          .content-card {
              min-height: 320px;
          }
      }
  </style>
</head>

<body>
<div id="root"></div>

<script>
  const rootElement = document.getElementById('root');

  const appStorage = (() => {
    const stateKey = 'client_portal_state_v1';

    const defaultState = {
      route: 'login',
      sidebarExpanded: false,
      isAuthenticated: false,
      clientName: null,
      terminalInstrument: 'EURUSD',
      theme: 'light'
    };

    const parseJson = (rawValue) => {
      try {
        return JSON.parse(rawValue);
      } catch {
        console.warn('JSON parsing failed for storage');
        return {};
      }
    };

    const readState = () => {
      const rawValue = localStorage.getItem(stateKey);

      if (!rawValue) {
        return {
          ...defaultState
        };
      }

      return {
        ...defaultState,
        ...parseJson(rawValue)
      };
    };

    const writeState = (state) => {
      localStorage.setItem(stateKey, JSON.stringify(state));
    };

    const getState = () => {
      return readState();
    };

    const setState = (partialState) => {
      const nextState = {
        ...getState(),
        ...partialState
      };

      writeState(nextState);

      return nextState;
    };

    return {
      getState,
      setState
    };
  })();

  const routes = {
    login: 'login',
    profile: 'profile',
    accounts: 'accounts',
    terminal: 'terminal'
  };

  const themes = {
    light: 'light',
    dark: 'dark'
  };

  const protectedRoutes = [
    routes.profile,
    routes.accounts,
    routes.terminal
  ];

  const menuItems = [
    {
      route: routes.profile,
      label: 'Profile',
      icon: 'images/profile-icon.svg'
    },
    {
      route: routes.accounts,
      label: 'Accounts',
      icon: 'images/accounts-icon.svg'
    },
    {
      route: routes.terminal,
      label: 'Terminal',
      icon: 'images/trade-icon.svg'
    }
  ];

  const tradingViewScriptSources = [
    'https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js',
    'https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js',
    'scripts/lightweight-charts.standalone.production.js'
  ];

  const terminalInstruments = [
    {
      symbol: 'EURUSD',

  let tradingViewScriptPromise = null;
  let terminalRuntime = null;

  const isProtectedRoute = (route) => {
    return protectedRoutes.includes(route);
  };

  const normalizeTheme = (theme) => {
    return Object.values(themes).includes(theme)
      ? theme
      : themes.light;
  };

  const getCurrentTheme = () => {
    return normalizeTheme(appStorage.getState().theme);

  const applyTheme = (theme) => {
    document.documentElement.dataset.theme = normalizeTheme(theme);
  };

  const toggleTheme = () => {
    const nextTheme = getCurrentTheme() === themes.dark
      ? themes.light
      : themes.dark;

    appStorage.setState({
      theme: nextTheme

    applyTheme(nextTheme);
    updateThemeDependentUi();
    updateTerminalChartTheme();
  };

  const getCssVariableValue = (name) => {
    return getComputedStyle(document.documentElement)
      .getPropertyValue(name)
      .trim();
  };

  const getCurrentLogo = () => {
    return getCurrentTheme() === themes.dark
      ? 'images/oneroyal-logo-dark.svg'
      : 'images/oneroyal-logo.svg';
  };

  const getThemeToggleConfig = () => {
    const isDarkTheme = getCurrentTheme() === themes.dark;

    return {
      icon: isDarkTheme
        ? 'images/sun.svg'

      label: isDarkTheme
        ? 'Light Theme'

  const updateThemeDependentUi = () => {
    document.querySelectorAll('.app-logo').forEach((logoElement) => {
      logoElement.setAttribute('src', getCurrentLogo());

    const themeButton = document.getElementById('theme_toggle_button');
    const themeIcon = document.getElementById('theme_toggle_icon');
    const themeLabel = document.getElementById('theme_toggle_label');

    if (!themeButton || !themeIcon || !themeLabel) {
      return;
    }

    const themeConfig = getThemeToggleConfig();

    themeButton.setAttribute('aria-label', themeConfig.ariaLabel);
    themeIcon.setAttribute('src', themeConfig.icon);
    themeLabel.textContent = themeConfig.label;
  };

  const updateTerminalChartTheme = () => {
    if (!terminalRuntime || !terminalRuntime.chart) {
      return;
    }

    terminalRuntime.chart.applyOptions({
      layout: {
        background: {
          color: getCssVariableValue('--chart-bg')
        }
      }
    });

  const loginCredentials = {
    login: 'testLogin',
    password: 'testPassword'
  };

  const loginUser = (login, password) => {
    const isValidUser = login === loginCredentials.login && password === loginCredentials.password;

    if (!isValidUser) {
      return false;
    }

    appStorage.setState({
      route: routes.terminal,
      isAuthenticated: true,
      clientName: login

    return true;
  };

  const logoutUser = () => {
    destroyTerminalChart();

    appStorage.setState({
      route: routes.login,
      isAuthenticated: false,
      clientName: null,
      sidebarExpanded: false

    if (window.location.hash !== `#${routes.login}`) {
      window.location.hash = routes.login;
      return;
    }

    renderApp();
  };

  const getRouteFromHash = () => {
    const route = window.location.hash.replace('#', '').trim();

    if (!route) {
      return null;
    }

    return route;
  };

  const getCurrentRoute = () => {
    const routeFromHash = getRouteFromHash();

    if (routeFromHash) {
      return routeFromHash;
    }

    return appStorage.getState().route || routes.login;
  };

  const navigateTo = (route) => {
    appStorage.setState({
      route
    });

    if (window.location.hash !== `#${route}`) {
      window.location.hash = route;
      return;
    }

    renderApp();
  };

  const appendChildren = (parentElement, children) => {
    children.flat(Infinity).forEach((child) => {
      if (child === null || child === undefined || child === false) {
        return;
      }

      if (typeof child === 'string' || typeof child === 'number') {
        parentElement.append(document.createTextNode(String(child)));
        return;
      }

      parentElement.append(child);
    });
  };

  const createElement = (tagName, options = {}, children = []) => {
    const element = document.createElement(tagName);

    Object.entries(options).forEach(([key, value]) => {
      if (key === 'className') {
        element.className = value;
        return;
      }

      if (key === 'textContent') {
        element.textContent = value;
        return;
      }

      if (key === 'htmlFor') {
        element.htmlFor = value;
        return;
      }

      if (key === 'checked') {
        element.checked = Boolean(value);
        return;
      }

      if (key === 'disabled') {
        element.disabled = Boolean(value);
        return;
      }

      if (key === 'selected') {
        element.selected = Boolean(value);
        return;
      }

      if (value === null || value === undefined || value === false) {
        return;
      }

      if (key.startsWith('on') && typeof value === 'function') {
        const eventName = key.slice(2).toLowerCase();
        element.addEventListener(eventName, value);
        return;
      }

      element.setAttribute(key, String(value));
    });

    appendChildren(element, children);

    return element;
  };

  const createAppBrand = () => {

  const createAppHeader = () => {

  const createLoginMain = () => {

          createElement('div', {

  const createSidebarHeader = () => {

        type: 'button',
        'aria-label': themeConfig.ariaLabel,

      }, [
        createElement('img', {

  const createContentCard = (title, children) => {

  const createProfilePage = () => {

  const createAccountsPage = () => {
    return createContentCard('Accounts', [
      createElement('div', {

        createElement('div', {
          className: 'account-card'
        }, [
          createElement('div', {}, [

            createElement('p', {

            createElement('p', {
              className: 'account-name',
              textContent: 'Investment Account'
            }),

            createElement('p', {

            })
          ]),

          createElement('strong', {

  const loadScriptOnce = (src, id) => {
    return new Promise((resolve, reject) => {
      const existingScript = document.getElementById(id);

      if (existingScript && existingScript.dataset.loaded === 'true') {
        resolve(existingScript);
        return;
      }

      if (existingScript) {
        existingScript.addEventListener('load', () => {
          resolve(existingScript);
        }, { once: true });

        existingScript.addEventListener('error', () => {
          reject(new Error(`Script loading failed: ${src}`));
        }, { once: true });

        return;
      }

      const script = document.createElement('script');

      script.id = id;
      script.src = src;
      script.async = true;

      script.addEventListener('load', () => {
        script.dataset.loaded = 'true';
        resolve(script);
      }, { once: true });

      script.addEventListener('error', () => {
        script.remove();
        reject(new Error(`Script loading failed: ${src}`));
      }, { once: true });

      document.body.append(script);
    });
  };

  const loadTradingViewLibrary = async () => {
    if (window.LightweightCharts) {
      return window.LightweightCharts;
    }

    if (tradingViewScriptPromise) {
      return tradingViewScriptPromise;
    }

    tradingViewScriptPromise = (async () => {
      let lastError = null;

      for (const [index, src] of tradingViewScriptSources.entries()) {
        try {
          await loadScriptOnce(src, `tradingview_lightweight_charts_script_${index}`);

          if (window.LightweightCharts) {
            return window.LightweightCharts;
          }

          lastError = new Error(`LightweightCharts global object was not found after loading: ${src}`);
        } catch (error) {
          lastError = error;
        }
      }

      throw lastError || new Error('TradingView library was not loaded');
    })().catch((error) => {
      tradingViewScriptPromise = null;
      throw error;
    });

    return tradingViewScriptPromise;
  };

  const getTerminalInstrument = (symbol) => {
    return terminalInstruments.find((instrument) => {
      return instrument.symbol === symbol;
    }) || terminalInstruments[0];
  };

  const roundPrice = (value, decimals) => {
    return Number(value.toFixed(decimals));
  };

  const getDateString = (date) => {
    return date.toISOString().slice(0, 10);
  };

  const generateDailyCandles = (instrument) => {
    const candles = [];
    const today = new Date();
    let close = instrument.basePrice;

    for (let index = 90; index >= 0; index -= 1) {
      const date = new Date(today);

      date.setDate(today.getDate() - index);

      const open = close;
      const direction = Math.random() - 0.5;
      const change = direction * instrument.step * 5;
      const nextClose = roundPrice(open + change, instrument.decimals);
      const high = roundPrice(Math.max(open, nextClose) + Math.random() * instrument.step * 3, instrument.decimals);
      const low = roundPrice(Math.min(open, nextClose) - Math.random() * instrument.step * 3, instrument.decimals);

      close = nextClose;

      candles.push({
        time: getDateString(date),
        open: roundPrice(open, instrument.decimals),
        high,
        low,
        close: nextClose
      });
    }

    return candles;
  };

  const setTerminalStatus = (message) => {
    const statusElement = document.getElementById('terminal_chart_status');

    if (statusElement) {
      statusElement.textContent = message;
    }
  };

  const setTerminalPrice = (instrument, price) => {
    const priceElement = document.getElementById('terminal_price_value');

    if (priceElement) {
      priceElement.textContent = `${instrument.label} ${price.toFixed(instrument.decimals)}`;
    }
  };

  const destroyTerminalChart = () => {
    if (!terminalRuntime) {
      return;
    }

    if (terminalRuntime.intervalId) {
      window.clearInterval(terminalRuntime.intervalId);
    }

    if (terminalRuntime.resizeObserver) {
      terminalRuntime.resizeObserver.disconnect();
    }

    if (terminalRuntime.chart) {
      terminalRuntime.chart.remove();
    }

    terminalRuntime = null;
  };

  const initTerminalPage = async () => {
    const chartContainer = document.getElementById('terminal_chart');

    if (!chartContainer) {
      return;
    }

    destroyTerminalChart();
    setTerminalStatus('Loading TradingView charting library...');

    try {
      const lightweightCharts = await loadTradingViewLibrary();
      const activeInstrument = getTerminalInstrument(appStorage.getState().terminalInstrument);
      const chartBackgroundColor = getCssVariableValue('--chart-bg');
      const chartTextColor = getCssVariableValue('--chart-text-color');
      const chartGridColor = getCssVariableValue('--chart-grid-color');
      const chartBorderColor = getCssVariableValue('--chart-border-color');
      const chartUpColor = getCssVariableValue('--chart-up-color');
      const chartDownColor = getCssVariableValue('--chart-down-color');

      if (!document.getElementById('terminal_chart')) {
        return;
      }

      const chart = lightweightCharts.createChart(chartContainer, {
        width: chartContainer.clientWidth,
        height: chartContainer.clientHeight,
        layout: {
          background: {
            color: chartBackgroundColor
          },
          textColor: chartTextColor
        },
        grid: {
          vertLines: {
            color: chartGridColor
          },
          horzLines: {
            color: chartGridColor
          }
        },
        rightPriceScale: {
          borderColor: chartBorderColor
        },
        timeScale: {
          borderColor: chartBorderColor
        }
      });

      const candleSeries = chart.addCandlestickSeries({
        upColor: chartUpColor,
        downColor: chartDownColor,
        borderUpColor: chartUpColor,
        borderDownColor: chartDownColor,
        wickUpColor: chartUpColor,
        wickDownColor: chartDownColor
      });

      const candles = generateDailyCandles(activeInstrument);
      let lastCandle = {
        ...candles[candles.length - 1]
      };

      candleSeries.setData(candles);
      chart.timeScale().fitContent();

      setTerminalPrice(activeInstrument, lastCandle.close);
      setTerminalStatus('Emulated daily candles and real-time price are running.');

      const resizeObserver = new ResizeObserver(() => {
        chart.applyOptions({
          width: chartContainer.clientWidth,
          height: chartContainer.clientHeight
        });
      });

      resizeObserver.observe(chartContainer);

      const intervalId = window.setInterval(() => {
        const priceChange = (Math.random() - 0.5) * activeInstrument.step;
        const nextClose = roundPrice(lastCandle.close + priceChange, activeInstrument.decimals);

        lastCandle = {
          ...lastCandle,
          high: roundPrice(Math.max(lastCandle.high, nextClose), activeInstrument.decimals),
          low: roundPrice(Math.min(lastCandle.low, nextClose), activeInstrument.decimals),
          close: nextClose
        };

        candleSeries.update(lastCandle);
        setTerminalPrice(activeInstrument, nextClose);
      }, 1200);

      terminalRuntime = {
        chart,
        intervalId,
        resizeObserver
      };
    } catch (error) {
      console.warn(error);
      setTerminalStatus('TradingView library was not loaded. Put lightweight-charts.standalone.production.js into the scripts folder and reload the page.');
    }
  };

  const createTerminalPage = () => {
    const appState = appStorage.getState();
    const activeInstrument = getTerminalInstrument(appState.terminalInstrument);

    return createElement('section', {
      className: 'content-card terminal-card'
    }, [
      createElement('h2', {
        className: 'content-title',
        textContent: 'Terminal'
      }),

      createElement('div', {
        className: 'terminal-toolbar'
      }, [
        createElement('div', {
          className: 'terminal-control'
        }, [
          createElement('label', {
            className: 'terminal-label',
            htmlFor: 'terminal_instrument',
            textContent: 'Instrument'
          }),

          createElement('select', {
            className: 'terminal-select',
            id: 'terminal_instrument',
            name: 'terminal_instrument',
            onChange: (event) => {
              appStorage.setState({
                terminalInstrument: event.currentTarget.value
              });

              initTerminalPage();
            }
          }, terminalInstruments.map((instrument) => {
            return createElement('option', {
              value: instrument.symbol,
              selected: instrument.symbol === activeInstrument.symbol,
              textContent: instrument.label
            });
          }))
        ]),

        createElement('div', {
          className: 'terminal-price'
        }, [
          createElement('span', {
            className: 'terminal-price-label',
            textContent: 'Current price'
          }),

          createElement('strong', {
            className: 'terminal-price-value',
            id: 'terminal_price_value',
            textContent: 'Loading...'
          })
        ])
      ]),

      createElement('div', {
        className: 'terminal-chart',
        id: 'terminal_chart'
      }),

      createElement('p', {
        className: 'terminal-status',
        id: 'terminal_chart_status',
        textContent: 'Chart is not loaded yet.'
      })
    ]);
  };

  const createPageContent = (route) => {
    if (route === routes.accounts) {
      return createAccountsPage();
    }

    if (route === routes.terminal) {
      return createTerminalPage();
    }

    return createProfilePage();
  };

  const createSidebarLayout = () => {
    const appState = appStorage.getState();
    const activeRoute = isProtectedRoute(appState.route)
      ? appState.route
      : routes.profile;

    return [
      createElement('input', {
        className: 'sidebar-state',
        id: 'sidebar_state',
        type: 'checkbox',
        checked: appState.sidebarExpanded,
        onChange: (event) => {
          appStorage.setState({
            sidebarExpanded: event.currentTarget.checked
          });
        }
      }),

      createSidebarHeader(),

      createElement('div', {
        className: 'app-shell'
      }, [
        createElement('aside', {
          className: 'sidebar'
        }, [
          createElement('div', {
            className: 'sidebar-inner'
          }, [
            createElement('h2', {
              className: 'sidebar-heading',
              textContent: 'Menu'
            }),

            createSidebarMenu(activeRoute)
          ])
        ]),

        createElement('label', {
          className: 'desktop-sidebar-toggle',
          htmlFor: 'sidebar_state',
          'aria-label': 'Toggle sidebar'
        }),

        createElement('main', {
          className: 'content'
        }, [
          createElement('div', {
            className: 'page-grid'
          }, [
            createPageContent(activeRoute)
          ])
        ])
      ])
    ];
  };

  const renderApp = () => {
    const route = getCurrentRoute();
    const appState = appStorage.getState();

    applyTheme(appState.theme);

    if (!appState.isAuthenticated) {
      destroyTerminalChart();

      appStorage.setState({
        route: routes.login
      });

      if (window.location.hash !== `#${routes.login}`) {
        window.location.hash = routes.login;
        return;
      }

      rootElement.replaceChildren(...renderLoginPage());
      return;
    }

    if (route === routes.login) {
      const savedRoute = isProtectedRoute(appState.route)
        ? appState.route
        : routes.profile;

      navigateTo(savedRoute);
      return;
    }

    const nextRoute = isProtectedRoute(route)
      ? route
      : routes.profile;

    appStorage.setState({
      route: nextRoute
    });

    if (window.location.hash !== `#${nextRoute}`) {
      window.location.hash = nextRoute;
      return;
    }

    rootElement.replaceChildren(...createSidebarLayout());

    if (nextRoute === routes.terminal) {
      requestAnimationFrame(() => {
        initTerminalPage();
      });
    } else {
      destroyTerminalChart();
    }
  };

  window.addEventListener('hashchange', renderApp);

  applyTheme(appStorage.getState().theme);

  const initialRoute = getCurrentRoute();

  if (!window.location.hash) {
    window.location.hash = initialRoute;
  } else {
    renderApp();
  }
</script>
