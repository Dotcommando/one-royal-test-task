<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login page</title>

  <style>
      :root {
          --q-screen-xs-min: 0px;
          --q-screen-sm-min: 600px;
          --q-screen-md-min: 1024px;
          --q-screen-lg-min: 1440px;
          --q-screen-xl-min: 1920px;

          --app-min-width: 320px;
          --header-height: 64px;
          --page-bg: #f4f6fb;
          --header-bg: #151923;
          --header-color: #ffffff;
          --card-bg: #ffffff;
          --card-border: #dfe3ec;
          --card-radius: 14px;
          --content-bg: #ffffff;
          --border-color: #dfe3ec;

          --sidebar-expanded-width: 100%;
          --sidebar-collapsed-width: 0px;
          --sidebar-desktop-expanded-width: min(25vw, 220px);
          --sidebar-desktop-collapsed-width: 80px;

          --toggle-size: 42px;
          --transition-speed: 220ms;

          --sidebar-bg: #202637;
          --sidebar-color: #ffffff;
      }

      * {
          box-sizing: border-box;
      }

      html,
      body {
          width: 100%;
          min-width: var(--app-min-width);
          min-height: 100%;
          margin: 0;
          font-family: Arial, sans-serif;
          background: var(--page-bg);
      }

      body {
          min-height: 100vh;
      }

      #root {
          width: 100%;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
      }

      .app-header {
          height: var(--header-height);
          max-height: 80px;
          flex: 0 0 var(--header-height);
          display: flex;
          align-items: center;
          padding: 0 16px;
          background: var(--header-bg);
          color: var(--header-color);
      }

      .app-title {
          margin: 0;
          font-size: 18px;
          font-weight: 700;
      }

      .app-main {
          min-height: calc(100vh - var(--header-height));
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 16px;
          overflow: auto;
      }

      .login-card {
          width: 100%;
          max-width: 380px;
          min-height: 260px;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          border: 1px solid var(--card-border);
          border-radius: var(--card-radius);
          background: var(--card-bg);
      }

      .login-form {
          width: 100%;
          display: flex;
          flex-direction: column;
          gap: 16px;
      }

      .login-form-title {
          margin: 0 0 4px;
          color: #151923;
          font-size: 22px;
          font-weight: 700;
          text-align: center;
      }

      .login-form-subtitle {
          margin: 0 0 8px;
          color: #667085;
          font-size: 14px;
          line-height: 1.4;
          text-align: center;
      }

      .login-field {
          display: flex;
          flex-direction: column;
          gap: 6px;
      }

      .login-label {
          color: #344054;
          font-size: 14px;
          font-weight: 600;
      }

      .login-input {
          width: 100%;
          height: 44px;
          padding: 0 12px;
          border: 1px solid var(--card-border);
          border-radius: 10px;
          background: #ffffff;
          color: #151923;
          font-size: 15px;
          outline: none;
          transition:
                  border-color var(--transition-speed) ease,
                  box-shadow var(--transition-speed) ease;
      }

      .login-input:focus {
          border-color: #667085;
          box-shadow: 0 0 0 3px rgba(102, 112, 133, 0.14);
      }

      .login-submit {
          width: 100%;
          height: 46px;
          margin-top: 4px;
          border: 0;
          border-radius: 10px;
          background: #151923;
          color: #ffffff;
          font-size: 15px;
          font-weight: 700;
          cursor: pointer;
          transition:
                  background var(--transition-speed) ease,
                  transform var(--transition-speed) ease;
      }

      .login-submit:hover {
          background: #252c3a;
      }

      .login-submit:active {
          transform: translateY(1px);
      }

      .sidebar-state {
          position: absolute;
          width: 1px;
          height: 1px;
          opacity: 0;
          pointer-events: none;
      }

      .mobile-sidebar-toggle {
          width: var(--toggle-size);
          height: var(--toggle-size);
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 999px;
          background: #ffffff;
          color: #151923;
          font-size: 22px;
          line-height: 1;
          cursor: pointer;
          user-select: none;
      }

      .desktop-sidebar-toggle {
          display: none;
      }

      .app-shell {
          position: relative;
          min-height: calc(100vh - var(--header-height));
          flex: 1 1 auto;
          display: flex;
          overflow: hidden;
      }

      .sidebar {
          width: var(--sidebar-collapsed-width);
          flex: 0 0 var(--sidebar-collapsed-width);
          min-height: calc(100vh - var(--header-height));
          overflow: hidden;
          background: var(--sidebar-bg);
          color: var(--sidebar-color);
          transition:
                  width var(--transition-speed) ease,
                  flex-basis var(--transition-speed) ease;
      }

      .sidebar-inner {
          width: 100vw;
          max-width: 320px;
          min-height: 100%;
          padding: 16px;
          opacity: 0;
          transition: opacity var(--transition-speed) ease;
      }

      .sidebar-heading {
          margin: 0 0 16px;
          font-size: 16px;
          font-weight: 700;
      }

      .sidebar-placeholder {
          margin: 0;
          color: #c8d0e0;
          font-size: 14px;
          line-height: 1.5;
      }

      .sidebar-state:checked ~ .app-shell .sidebar {
          width: var(--sidebar-expanded-width);
          flex-basis: var(--sidebar-expanded-width);
      }

      .sidebar-state:checked ~ .app-shell .sidebar-inner {
          opacity: 1;
      }

      @media (min-width: 600px) {
          :root {
              --header-height: 68px;
          }

          .app-header {
              padding: 0 24px;
          }

          .app-main {
              padding: 24px;
          }

          .content {
              padding: 24px;
          }
      }

      @media (min-width: 1024px) {
          .login-card {
              max-width: 420px;
          }

          .mobile-sidebar-toggle {
              display: none;
          }

          .desktop-sidebar-toggle {
              position: absolute;
              top: 24px;
              left: calc(var(--sidebar-desktop-collapsed-width) - (var(--toggle-size) / 2));
              width: var(--toggle-size);
              height: var(--toggle-size);
              display: flex;
              align-items: center;
              justify-content: center;
              border: 1px solid var(--border-color);
              border-radius: 999px;
              background: #ffffff;
              color: #151923;
              font-size: 22px;
              line-height: 1;
              cursor: pointer;
              user-select: none;
              z-index: 4;
              transition: left var(--transition-speed) ease;
          }

          .sidebar {
              width: var(--sidebar-desktop-collapsed-width);
              flex-basis: var(--sidebar-desktop-collapsed-width);
          }

          .sidebar-inner {
              width: var(--sidebar-desktop-expanded-width);
              max-width: var(--sidebar-desktop-expanded-width);
              opacity: 1;
          }

          .content {
              width: auto;
              height: calc(100vh - var(--header-height));
          }

          .sidebar-state:checked ~ .app-shell .sidebar {
              width: var(--sidebar-desktop-expanded-width);
              flex-basis: var(--sidebar-desktop-expanded-width);
          }

          .sidebar-state:checked ~ .app-shell .desktop-sidebar-toggle {
              left: calc(var(--sidebar-desktop-expanded-width) - (var(--toggle-size) / 2));
          }
      }

      @media (min-width: 1440px) {
          .login-card {
              max-width: 460px;
          }
      }

      @media (min-width: 1920px) {
          .login-card {
              max-width: 500px;
          }
      }
  </style>
</head>

<body>
<div id="root"></div>

<script>
  const rootElement = document.getElementById('root');

  const appendChildren = (parentElement, children) => {
    children.flat(Infinity).forEach((child) => {
      if (child === null || child === undefined || child === false) {
        return;
      }

      if (typeof child === 'string' || typeof child === 'number') {
        parentElement.append(document.createTextNode(String(child)));
        return;
      }

      parentElement.append(child);
    })
  }

  const createElement = (tagName, options = {}, children = []) => {
    const element = document.createElement(tagName);

    Object.entries(options).forEach(([key, value]) => {
      if (value === null || value === undefined || value === false) {
        return;
      }

      if (key === 'className') {
        element.className = value;
        return;
      }

      if (key === 'textContent') {
        element.textContent = value;
        return;
      }

      if (key === 'htmlFor') {
        element.htmlFor = value;
        return;
      }

      if (key.startsWith('on') && typeof value === 'function') {
        const eventName = key.slice(2).toLowerCase();
        element.addEventListener(eventName, value);
        return;
      }

      element.setAttribute(key, String(value));
    })

    appendChildren(element, children);

    return element;
  }

  const createAppHeader = () => {
    return createElement('header', {
      className: 'app-header'
    }, [
      createElement('h1', {
        className: 'app-title',
        textContent: 'Client Portal'
      })
    ]);
  }

  const createLoginMain = () => {
    return createElement('main', {
      className: 'app-main'
    }, [
      createElement('section', {
        className: 'login-card'
      }, [
        createElement('form', {
          className: 'login-form',
          onSubmit: (event) => {
            event.preventDefault();
          }
        }, [
          createElement('h2', {
            className: 'login-form-title',
            textContent: 'Login'
          }),

          createElement('p', {
            className: 'login-form-subtitle',
            textContent: 'Enter your credentials to continue.'
          }),

          createElement('div', {
            className: 'login-field'
          }, [
            createElement('label', {
              className: 'login-label',
              htmlFor: 'login_username',
              textContent: 'Login'
            }),

            createElement('input', {
              className: 'login-input',
              id: 'login_username',
              name: 'login',
              type: 'text',
              autocomplete: 'username',
              placeholder: 'Enter login'
            })
          ]),

          createElement('div', {
            className: 'login-field'
          }, [
            createElement('label', {
              className: 'login-label',
              htmlFor: 'login_password',
              textContent: 'Password'
            }),

            createElement('input', {
              className: 'login-input',
              id: 'login_password',
              name: 'password',
              type: 'password',
              autocomplete: 'current-password',
              placeholder: 'Enter password'
            })
          ]),

          createElement('button', {
            className: 'login-submit',
            type: 'submit',
            textContent: 'Submit'
          })
        ])
      ])
    ]);
  }

  const renderLoginPage = () => {
    return [
      createAppHeader(),
      createLoginMain()
    ];
  }

  const createSidebarLayout = () => {
    return [
      createElement('input', {
        className: 'sidebar-state',
        id: 'sidebar_state',
        type: 'checkbox'
      }),

      createElement('header', {
        className: 'app-header'
      }, [
        createElement('h1', {
          className: 'app-title',
          textContent: 'Client Portal'
        }),

        createElement('label', {
          className: 'mobile-sidebar-toggle',
          htmlFor: 'sidebar_state',
          'aria-label': 'Toggle sidebar',
          textContent: '☰'
        })
      ]),

      createElement('div', {
        className: 'app-shell'
      }, [
        createElement('aside', {
          className: 'sidebar'
        }, [
          createElement('div', {
            className: 'sidebar-inner'
          }, [
            createElement('h2', {
              className: 'sidebar-heading',
              textContent: 'Sidebar'
            }),

            createElement('p', {
              className: 'sidebar-placeholder',
              textContent: 'kjhfgk ufkhgf kgfkfgk gfkghfkhgf ugfkfg kgfkgf fghfkhg  kfghgf kfgkhgf'
            })
          ])
        ]),

        createElement('label', {
          className: 'desktop-sidebar-toggle',
          htmlFor: 'sidebar_state',
          'aria-label': 'Toggle sidebar',
          textContent: '‹'
        }),

        createElement('main', {
          className: 'content'
        }, [
          createElement('section', {
            className: 'content-card'
          }, [
            createElement('h2', {
              className: 'content-title',
              textContent: 'Content area'
            }),

            createElement('p', {
              className: 'content-text',
              textContent: 'sfgs fdgasfg sf dg sdf gd sfg sdf gs dfg sdf gsd fgsdfg sdf gs'
            })
          ])
        ])
      ])
    ]
  }

  // rootElement.replaceChildren(...createSidebarLayout());

  rootElement.replaceChildren(...renderLoginPage());
</script>
</body>
</html>
